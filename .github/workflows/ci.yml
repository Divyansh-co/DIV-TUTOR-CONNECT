name: TutorConnect CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Backend Quality, Linting & Pytest Tests
  backend-tests:
    name: Backend CI (Django & Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tutorconnect_test_db
          POSTGRES_USER: tutorconnect_user
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        working-directory: ./backend
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://tutorconnect_user:testpassword123@localhost:5432/tutorconnect_test_db
          REDIS_URL: redis://localhost:6379/1
          CELERY_BROKER_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          STRIPE_SECRET_KEY: sk_test_sample_tutorconnect_key
        run: |
          pytest -v

  # Job 2: Frontend Quality, TypeScript Check & Vitest Tests
  frontend-tests:
    name: Frontend CI (React & Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package*.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build

  # Job 3: Continuous Deployment (Render / Railway Webhook Trigger)
  deploy:
    name: Production Deployment
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Railway / Render Production Deploy Webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.RENDER_OR_RAILWAY_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Dispatching deploy trigger to production cluster..."
            curl -X POST "$DEPLOY_WEBHOOK_URL"
          else
            echo "No deploy webhook configured. Skipping automated cloud trigger."
          fi
