version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: tutorconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutorconnect_db
      POSTGRES_USER: tutorconnect_user
      POSTGRES_PASSWORD: tutorconnect_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorconnect_user -d tutorconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Celery Message Broker Service
  redis:
    image: redis:7-alpine
    container_name: tutorconnect_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django REST Framework Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutorconnect_backend
    restart: unless-stopped
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-prod-saas-key-tutorconnect-divyansh-2026
      - DATABASE_URL=postgres://tutorconnect_user:tutorconnect_secure_password_2026@postgres:5432/tutorconnect_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend
      - STRIPE_PUBLIC_KEY=pk_test_sample_tutorconnect_key
      - STRIPE_SECRET_KEY=sk_test_sample_tutorconnect_key
      - STRIPE_WEBHOOK_SECRET=whsec_sample_tutorconnect_secret
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Asynchronous Task Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutorconnect_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l INFO --concurrency=2
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-prod-saas-key-tutorconnect-divyansh-2026
      - DATABASE_URL=postgres://tutorconnect_user:tutorconnect_secure_password_2026@postgres:5432/tutorconnect_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Periodic Task Scheduler (Beat)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutorconnect_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-prod-saas-key-tutorconnect-divyansh-2026
      - DATABASE_URL=postgres://tutorconnect_user:tutorconnect_secure_password_2026@postgres:5432/tutorconnect_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # React (Vite) + Tailwind CSS Frontend served via Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tutorconnect_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_media:
  backend_static:
